{% extends "base.html" %}
{% block content %}

<h2 class="page-heading">{{ _('eval.heading') }}</h2>

<div class="row">
  <div class="col-md-7">
    <div class="card animate-in">
      <div class="card-header fw-bold">{{ _('eval.eval_params') }}</div>
      <div class="card-body">
        <form id="eval-form" data-task-form="true" data-model-select="model_path" data-completion-attr="data-has-results" data-completed-message="{{ _('eval.already_exists') }}" onsubmit="submitTask(event, '/eval/start')">
          <div class="mb-3">
            <label class="form-label">{{ _('eval.model') }}</label>
            <select name="model_path" class="form-select" required>
              <option value="">{{ _('eval.select_model') }}</option>
              {% for m in models %}
              <option value="{{ m.rel_path }}" data-has-results="{{ 'true' if m.has_results else 'false' }}">{{ m.rel_path }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">{{ _('eval.iteration') }}</label>
              <input type="number" name="iteration" class="form-control" value="30000" min="1000">
            </div>
          </div>

          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="skip_train" value="true" id="skipTrain" checked>
              <label class="form-check-label" for="skipTrain">{{ _('eval.skip_train') }}</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="compare_vq" value="true" id="compareVq" checked>
              <label class="form-check-label" for="compareVq">{{ _('eval.compare_vq') }}</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary task-submit-btn" {% if has_active_task %}disabled{% endif %}>{{ _('eval.run_eval') }}</button>
          <div class="form-text text-warning mt-2 task-submit-note">{% if has_active_task %}{{ _('task.active_blocked') }}{% endif %}</div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-5">
    <div class="card animate-in">
      <div class="card-header fw-bold">{{ _('eval.log_output') }}</div>
      <div class="card-body p-0">
        <pre id="log-panel" class="log-panel p-3 mb-0" style="height:400px;overflow-y:auto;background:#1e1e1e;color:#d4d4d4;font-size:13px;">{{ _('eval.waiting_for_task') }}</pre>
      </div>
    </div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
initTaskForms();
</script>
{% endblock %}
