{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">1. Training</h2>

<div class="row">
  <div class="col-md-7">
    <div class="card">
      <div class="card-header fw-bold">Training Parameters</div>
      <div class="card-body">
        <form id="train-form" onsubmit="submitTask(event, '/train/start')">
          <div class="mb-3">
            <label class="form-label">Dataset</label>
            <select name="source_path" class="form-select" required>
              <option value="">-- Select Dataset --</option>
              {% for dset in datasets %}
              <optgroup label="{{ dset.name }}">
                {% for scene in dset.scenes %}
                <option value="{{ scene.path }}">{{ dset.name }}/{{ scene.name }}{% if not scene.has_colmap %} (no COLMAP){% endif %}</option>
                {% endfor %}
              </optgroup>
              {% endfor %}
            </select>
            <div class="form-text">Dataset root: {{ dataset_root }}</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Model Output Path</label>
            <input type="text" name="model_path" class="form-control" placeholder="auto-derived from dataset">
            <div class="form-text">Leave empty for auto: {{ model_root }}/&lt;dataset&gt;/&lt;scene&gt;</div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Resolution</label>
              <select name="resolution" class="form-select">
                <option value="-1">Full (1x)</option>
                <option value="2" selected>Half (2x)</option>
                <option value="4">Quarter (4x)</option>
                <option value="8">Eighth (8x)</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Iterations</label>
              <input type="number" name="iterations" class="form-control" value="30000" min="1000" step="1000">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">SH Degree</label>
              <input type="number" name="sh_degree" class="form-control" value="3" min="0" max="4">
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">v_pow (volume power)</label>
              <input type="number" name="v_pow" class="form-control" value="0.1" step="0.05" min="0.01">
            </div>
            <div class="col-md-6 mb-3 d-flex align-items-end">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="eval" value="true" id="evalCheck" checked>
                <label class="form-check-label" for="evalCheck">Use eval split (hold out test set)</label>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Start Training</button>
          <a href="/models" class="btn btn-outline-secondary">Browse Existing</a>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-5">
    <div class="card">
      <div class="card-header fw-bold">Log Output</div>
      <div class="card-body p-0">
        <pre id="log-panel" class="log-panel p-3 mb-0" style="height:400px;overflow-y:auto;background:#1e1e1e;color:#d4d4d4;font-size:13px;">Waiting for task submission...</pre>
      </div>
    </div>
  </div>
</div>

{% endblock %}
