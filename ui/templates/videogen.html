{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">{{ _('videogen.heading') }}</h2>

<div class="row">
  <div class="col-md-7">
    <div class="card">
      <div class="card-header fw-bold">{{ _('videogen.video_params') }}</div>
      <div class="card-body">
        <form id="videogen-form" onsubmit="submitTask(event, '/videogen/start')">
          <div class="mb-3">
            <label class="form-label">{{ _('videogen.model') }}</label>
            <select name="model_path" class="form-select" required>
              <option value="">{{ _('videogen.select_model') }}</option>
              {% for m in models %}
              <option value="{{ m.rel_path }}">{{ m.rel_path }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">{{ _('videogen.iteration') }}</label>
              <input type="number" name="iteration" class="form-control" value="30000" min="1000">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">{{ _('videogen.fps') }}</label>
              <input type="number" name="fps" class="form-control" value="30" min="1" max="120">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">{{ _('videogen.radius') }}</label>
              <input type="number" name="radius" class="form-control" value="5" step="0.5" min="0.5">
            </div>
          </div>

          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="load_vq" value="true" id="loadVq" checked>
              <label class="form-check-label" for="loadVq">{{ _('videogen.load_vq') }}</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="video" value="true" id="videoType" checked>
              <label class="form-check-label" for="videoType">{{ _('videogen.ellipse_video') }}</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="circular" value="true" id="circularType">
              <label class="form-check-label" for="circularType">{{ _('videogen.circular_video') }}</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="skip_train" value="true" id="skipTrain" checked>
              <label class="form-check-label" for="skipTrain">{{ _('videogen.skip_train') }}</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="skip_test" value="true" id="skipTest" checked>
              <label class="form-check-label" for="skipTest">{{ _('videogen.skip_test') }}</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">{{ _('videogen.generate_video') }}</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-5">
    <div class="card">
      <div class="card-header fw-bold">{{ _('videogen.log_output') }}</div>
      <div class="card-body p-0">
        <pre id="log-panel" class="log-panel p-3 mb-0" style="height:400px;overflow-y:auto;background:#1e1e1e;color:#d4d4d4;font-size:13px;">{{ _('videogen.waiting_for_task') }}</pre>
      </div>
    </div>
  </div>
</div>

{% endblock %}
